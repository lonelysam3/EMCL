<!DOCTYPE html>
<html lang="zh-CN" data-anim="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockLauncher</title>
<style>
:root {
  --mono: 'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace;
  --font: system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --accent:#7dd3fc; --accent-2:#2dd4bf; --accent-soft:rgba(125,211,252,0.10); --accent-border:rgba(125,211,252,0.22);
  --accent-grad:linear-gradient(135deg,#38bdf8,#2dd4bf);
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171; --info:#60a5fa;
  --text:#e4e7ec; --text-2:#8b93a3; --text-3:#4a5060;
  --bg:#090a0e; --bg-2:rgba(0,0,0,0.3);
  --surface:rgba(255,255,255,0.024); --surface-2:rgba(228,231,236,0.045);
  --surface-card-bg:rgba(255,255,255,0.024); --surface-card-border:rgba(228,231,236,0.06);
  --surface-panel-bg:rgba(255,255,255,0.024); --surface-panel-border:rgba(228,231,236,0.06);
  --surface-dock-bg:rgba(18,20,26,0.88); --surface-dock-blur:blur(24px);
  --surface-modal-bg:#0b0d12; --surface-modal-border:rgba(228,231,236,0.12);
  --surface-input-bg:rgba(0,0,0,0.2); --surface-input-border:rgba(228,231,236,0.06);
  --border:rgba(228,231,236,0.06); --border-hi:rgba(228,231,236,0.12);
  --text-display-color:transparent; --text-display-bg:linear-gradient(135deg,#38bdf8,#2dd4bf);
  --text-display-clip:text; --text-display-fill:transparent;
  --text-headline-color:#e4e7ec; --text-headline-bg:none;
  --text-headline-clip:border-box; --text-headline-fill:#e4e7ec;
  --radius-card:16px; --radius-small:10px; --radius:16px;
  --circuit-stroke:rgba(125,211,252,0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); font-size: 13px; -webkit-font-smoothing: antialiased; overflow: hidden; background: #090a0e; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }
html[data-anim="off"] *, html[data-anim="off"] *::before, html[data-anim="off"] *::after {
  transition-duration: 0ms !important; animation-duration: 0ms !important; animation-delay: 0ms !important;
}

/* 背景层 */
.app-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: #090a0e; }
.app-bg > .bg-layer { position: absolute; inset: 0; }

/* 图标 */
.icon { width: 18px; height: 18px; display: inline-block; vertical-align: middle; flex-shrink: 0; }
.icon-sm { width: 14px; height: 14px; }
.icon-lg { width: 20px; height: 20px; }
.icon-xl { width: 24px; height: 24px; }

.app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* 标题栏 */
.titlebar { height: 46px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); }
.logo { width: 24px; height: 24px; border-radius: 6px; background: var(--accent-grad); display: grid; place-items: center; flex-shrink: 0; color: #0a0b0f; }
.title-name { font-size: 12.5px; font-weight: 700; padding: 3px 7px; border-radius: 5px; border: 1px dashed transparent; outline: none; cursor: text; }
.title-name:hover { border-color: var(--border-hi); }
.title-name:focus { border-color: var(--accent); background: var(--accent-soft); border-style: solid; }
.spacer { flex: 1; }
.win-controls { display: flex; gap: 2px; }
.win-btn { width: 30px; height: 28px; border: none; background: transparent; color: var(--text-2); border-radius: 5px; cursor: pointer; display: grid; place-items: center; }
.win-btn:hover { background: var(--surface-2); color: var(--text); }
.win-btn.close:hover { background: var(--danger); color: #fff; }

/* 视图 */
.view { display: none; flex: 1; min-height: 0; }
.view.active { display: grid; }

/* 主布局 32/68 */
.main, .download-view, .instances-view {
  display: none; grid-template-columns: 32% 1fr; gap: 12px;
  padding: 12px 14px 14px; min-height: 0; overflow: hidden;
}
.main.active, .download-view.active, .instances-view.active { display: grid; }
.left-col, .download-left, .instances-left { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; overflow: hidden; position: relative; }
.right-col, .download-right, .instances-right { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; overflow-y: auto; }
.right-col { overflow: hidden; }
.download-right, .instances-right { padding: 18px 20px; background: var(--surface-panel-bg); border: 1px solid var(--surface-panel-border); border-radius: var(--radius-card); }

/* 账户卡片 */
.account-card { flex-shrink: 0; width: 100%; background: var(--surface-card-bg); border: 1px solid var(--surface-card-border); border-radius: var(--radius-card); padding: 18px 16px 16px; display: flex; flex-direction: column; align-items: center; }
.account-card[data-mode="offline"] { --mode: var(--accent); --mode-soft: var(--accent-soft); --mode-glow: var(--accent-border); }
.account-card[data-mode="authlib"] { --mode: #a78bfa; --mode-soft: rgba(167,139,250,0.10); --mode-glow: rgba(167,139,250,0.20); }
.account-card[data-mode="msa"] { --mode: #4ade80; --mode-soft: rgba(74,222,128,0.10); --mode-glow: rgba(74,222,128,0.20); }
.account-card { border-color: var(--mode-glow); box-shadow: 0 0 0 1px var(--mode-soft); }
.mode-row { display: inline-flex; align-items: center; gap: 7px; height: 22px; padding: 0 9px; border-radius: 999px; background: transparent; border: none; cursor: pointer; font-family: inherit; font-size: 11.5px; font-weight: 650; color: var(--mode); margin-bottom: 8px; user-select: none; }
.mode-row:hover { background: var(--mode-soft); }
.mode-icon { width: 13px; height: 13px; display: grid; place-items: center; }
.avatar-wrap { width: 60px; height: 60px; position: relative; margin-bottom: 14px; flex-shrink: 0; }
.avatar-canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.avatar-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: var(--mode); letter-spacing: -1px; }
.name-row { width: 100%; max-width: 200px; margin-bottom: 8px; position: relative; display: flex; justify-content: center; border-radius: 6px; }
.name-input { width: 100%; background: transparent; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 16px; font-weight: 750; text-align: center; padding: 2px 0; }
.name-input::placeholder { color: var(--text-3); font-weight: 600; }
.name-input[readonly] { cursor: default; }
.name-row::after { content: ''; position: absolute; left: 20%; right: 20%; bottom: -2px; height: 1px; background: var(--border-hi); opacity: 0; border-radius: 1px; }
.name-row:hover::after { opacity: 0.5; }
.name-row.focused::after { opacity: 1; background: var(--mode); left: 0; right: 0; }
.name-row.invalid { background: rgba(248,113,113,0.06); box-shadow: 0 0 0 1px rgba(248,113,113,0.18); }
.name-row.invalid::after { opacity: 1; background: var(--danger); left: 0; right: 0; }
.uuid-text { font-family: var(--mono); font-size: 10px; color: var(--text-3); text-align: center; word-break: break-all; line-height: 1.5; max-width: 240px; cursor: pointer; user-select: all; min-height: 14px; }
.uuid-text:hover { color: var(--text-2); }
.uuid-text.empty { cursor: default; opacity: 0.5; }
.uuid-sub { font-size: 10px; color: var(--text-3); text-align: center; margin-top: 4px; max-height: 0; overflow: hidden; opacity: 0; transition: max-height .3s, opacity .3s; }
.uuid-sub.visible { max-height: 20px; opacity: 1; }

/* ========== 活动面板（检测/控制台互斥） ========== */
.activity-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }

/* 检测视图 */
.detector-view { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-card); display: flex; flex-direction: column; overflow: hidden; transition: flex .35s cubic-bezier(.4,0,.2,1), min-height .35s; flex: 0 0 auto; min-height: 40px; }
.detector-view[data-mode="expanded"] { flex: 1; min-height: 100px; }
.detector-header { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 40px; flex-shrink: 0; cursor: pointer; }
.detector-header:hover { background: var(--surface-2); }
.detector-title { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-3); font-weight: 700; }
.detector-inline { display: flex; gap: 12px; flex: 1; justify-content: flex-end; align-items: center; font-family: var(--mono); font-size: 10.5px; font-weight: 600; }
.detector-inline-item { display: inline-flex; align-items: center; gap: 4px; }
.detector-inline-item .icon { width: 12px; height: 12px; }
.detector-inline-item.cpu { color: var(--accent); }
.detector-inline-item.mem { color: var(--info); }
.detector-inline-item.disk { color: var(--warn); }
.detector-toggle { width: 24px; height: 24px; border: none; background: transparent; color: var(--text-3); border-radius: 4px; cursor: pointer; display: grid; place-items: center; }
.detector-toggle:hover { background: var(--surface-2); color: var(--text); }
.detector-toggle .icon { width: 14px; height: 14px; transition: transform .3s; }
.detector-view[data-mode="expanded"] .detector-toggle .icon { transform: rotate(180deg); }
.detector-body { flex: 1; display: none; padding: 4px 12px 12px; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; }
.detector-view[data-mode="expanded"] .detector-body { display: flex; }
.detector-view[data-mode="expanded"] .detector-inline { display: none; }
.detector-card { background: var(--surface-card-bg); border: 1px solid var(--surface-card-border); border-radius: 10px; padding: 10px 12px; }
.detector-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 6px; }
.detector-card-label { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-3); font-weight: 700; }
.detector-card-label .icon { width: 12px; height: 12px; }
.detector-card-value { font-family: var(--mono); font-size: 13px; font-weight: 700; }
.detector-card-value.cpu { color: var(--accent); }
.detector-card-value.mem { color: var(--info); }
.detector-card-value.disk { color: var(--warn); }
.detector-bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.detector-bar i { display: block; height: 100%; border-radius: 2px; transition: width .6s, background .3s; }
.detector-bar.cpu i { background: var(--accent); }
.detector-bar.mem i { background: var(--info); }
.detector-bar.disk i { background: var(--warn); }
.detector-bar.disk.warn i { background: var(--danger); }

/* 控制台视图 */
.console-view { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-card); display: flex; flex-direction: column; overflow: hidden; transition: flex .35s cubic-bezier(.4,0,.2,1), min-height .35s; flex: 0 0 auto; min-height: 40px; }
.console-view[data-mode="expanded"] { flex: 1; min-height: 100px; }
.console-head { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 40px; flex-shrink: 0; cursor: pointer; }
.console-head:hover { background: var(--surface-2); }
.console-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; }
.console-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.console-dot.running { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.console-label { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-3); font-weight: 700; flex-shrink: 0; }
.console-badges { display: flex; gap: 6px; margin-left: auto; align-items: center; }
.console-badge { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 4px; font-size: 9.5px; font-weight: 700; font-family: var(--mono); }
.console-badge.warn { color: var(--warn); background: rgba(251,191,36,0.12); }
.console-badge.error { color: var(--danger); background: rgba(248,113,113,0.12); }
.console-badge .icon { width: 10px; height: 10px; }
.console-expand { width: 24px; height: 24px; border: none; background: transparent; color: var(--text-3); border-radius: 4px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
.console-expand:hover { background: var(--surface-2); color: var(--text); }
.console-expand .icon { width: 14px; height: 14px; transition: transform .3s; }
.console-view[data-mode="expanded"] .console-expand .icon { transform: rotate(180deg); }
.console-body { flex: 1; padding: 0 14px 12px; overflow-y: auto; font-family: var(--mono); font-size: 11px; line-height: 1.9; color: var(--text-2); display: none; }
.console-view[data-mode="expanded"] .console-body { display: block; }
.log-line { white-space: pre-wrap; word-break: break-all; animation: logIn .3s ease; }
@keyframes logIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.log-line .t { color: var(--text-3); }
.log-line .i { color: var(--info); }
.log-line .o { color: var(--ok); }
.log-line .w { color: var(--warn); }
.log-line .e { color: var(--danger); }
.empty-hint { color: var(--text-3); font-size: 10.5px; opacity: 0.5; text-align: center; margin-top: 40px; }

/* ========== 版本选择条 ========== */
.version-selector-bar { flex-shrink: 0; height: 46px; background: var(--surface-card-bg); border: 1px solid var(--surface-card-border); border-radius: var(--radius-card); padding: 0 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: border-color .15s, background .15s; }
.version-selector-bar:hover { border-color: var(--border-hi); background: var(--surface-2); }
.version-selector-bar.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
.vsb-icon { width: 20px; height: 20px; color: var(--accent); flex-shrink: 0; }
.vsb-info { flex: 1; min-width: 0; }
.vsb-label { font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-3); font-weight: 700; line-height: 1; margin-bottom: 3px; }
.vsb-name { font-size: 12.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vsb-meta { font-size: 10px; color: var(--text-3); font-family: var(--mono); flex-shrink: 0; }
.vsb-chevron { color: var(--text-3); flex-shrink: 0; transition: transform .2s; }
.version-selector-bar.open .vsb-chevron { transform: rotate(180deg); }

/* 版本 dock */
.version-dock { position: absolute; left: 0; right: 0; bottom: 56px; z-index: 30; background: var(--surface-modal-bg); border: 1px solid var(--surface-modal-border); border-radius: 12px; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); max-height: 60%; overflow-y: auto; padding: 6px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; }
.version-dock.open { opacity: 1; transform: none; pointer-events: auto; }
.vdock-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background .15s; }
.vdock-item:hover { background: var(--surface-2); }
.vdock-item.current { background: var(--accent-soft); }
.vdock-item.current .vdock-name { color: var(--accent); }
.vdock-type { width: 24px; height: 24px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; flex-shrink: 0; }
.vdock-type .icon { width: 12px; height: 12px; color: var(--text-2); }
.vdock-item.current .vdock-type { background: var(--accent-soft); }
.vdock-item.current .vdock-type .icon { color: var(--accent); }
.vdock-info { flex: 1; min-width: 0; }
.vdock-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.vdock-meta { font-size: 10px; color: var(--text-3); font-family: var(--mono); display: flex; gap: 6px; }
.vdock-item.current .vdock-meta::after { content: '当前'; color: var(--accent); font-weight: 700; }
.vdock-empty { padding: 24px; text-align: center; color: var(--text-3); font-size: 11px; }

/* ========== 版本卡（电路装饰 + 启动按钮） ========== */
.version-card {
  position: relative; background: radial-gradient(circle at 12% 0%, var(--accent-soft), transparent 55%), var(--surface-card-bg);
  border: 1px solid var(--accent-border); border-radius: var(--radius-card);
  padding: 20px 22px; display: flex; flex-direction: column; justify-content: space-between;
  overflow: hidden; cursor: pointer; transition: border-color .15s;
}
.version-card:hover { border-color: var(--accent); }
.version-card .circuit-decoration { position: absolute; inset: 0; pointer-events: none; opacity: 0.4; background-repeat: no-repeat; background-position: top right; background-size: 220px 220px; mask-image: linear-gradient(200deg, black 0%, transparent 60%); -webkit-mask-image: linear-gradient(200deg, black 0%, transparent 60%); }
.vc-name { font-size: 17px; font-weight: 750; letter-spacing: -0.35px; word-break: break-word; margin-bottom: 8px; color: var(--text-headline-color); background: var(--text-headline-bg); -webkit-background-clip: var(--text-headline-clip); background-clip: var(--text-headline-clip); -webkit-text-fill-color: var(--text-headline-fill); position: relative; z-index: 1; }
.vc-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; position: relative; z-index: 1; }
.tag { display: inline-flex; align-items: center; font-size: 10px; padding: 2.5px 9px; border-radius: 999px; font-weight: 650; }
.tag-a { background: var(--accent-soft); color: var(--accent); }
.tag-n { background: var(--surface-2); color: var(--text-2); }
.tag-server { background: rgba(167,139,250,0.12); color: #a78bfa; }
.vc-ver { font-size: 40px; font-weight: 850; letter-spacing: -2.5px; line-height: 1; margin-bottom: 4px; color: var(--text-display-color); background: var(--text-display-bg); -webkit-background-clip: var(--text-display-clip); background-clip: var(--text-display-clip); -webkit-text-fill-color: var(--text-display-fill); position: relative; z-index: 1; }
.vc-sub { font-size: 10.5px; color: var(--text-3); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; position: relative; z-index: 1; }
.vc-sub.server { color: #a78bfa; }
.vc-stats { display: flex; gap: 22px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; align-items: center; position: relative; z-index: 1; }
.vc-stat-n { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
.vc-stat-l { font-size: 9.5px; color: var(--text-3); letter-spacing: 1px; text-transform: uppercase; font-weight: 650; margin-top: 2px; }

/* 启动按钮（长按） */
.launch-btn {
  position: relative; margin-left: auto;
  height: 44px; padding: 0 18px 0 14px;
  border: 1px solid var(--accent-border); background: var(--accent-soft);
  color: var(--accent); border-radius: 10px;
  cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 750;
  display: inline-flex; align-items: center; gap: 8px;
  user-select: none; overflow: hidden;
  transition: background .15s, border-color .15s, color .15s;
}
.launch-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.launch-btn:active { transform: scale(0.98); }
.launch-btn.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
.launch-btn .icon { width: 16px; height: 16px; flex-shrink: 0; position: relative; z-index: 2; }
.launch-btn .launch-text { position: relative; z-index: 2; }
.launch-btn .launch-progress-bg {
  position: absolute; inset: 0;
  background: var(--accent-grad);
  transform-origin: left center;
  transform: scaleX(0);
  transition: transform 0ms linear;
  opacity: 0.6;
  z-index: 1;
}
.launch-btn.holding .launch-progress-bg { transition: transform .5s linear; transform: scaleX(1); }
.launch-btn.holding .launch-text, .launch-btn.holding .icon { color: #0a0b0f; }

/* 启动进度条（图标·图标·图标·图标） */
.launch-progress {
  display: none; align-items: center; gap: 4px;
  margin-top: 8px; padding: 8px 10px;
  background: var(--surface-input-bg); border: 1px solid var(--border);
  border-radius: 10px; width: 100%;
  position: relative; z-index: 1;
}
.launch-progress.visible { display: flex; }
.lp-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.lp-step-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; transition: all .3s; }
.lp-step-icon .icon { width: 14px; height: 14px; color: var(--text-3); }
.lp-step-label { font-size: 9px; color: var(--text-3); font-family: var(--mono); letter-spacing: 0.5px; font-weight: 600; white-space: nowrap; }
.lp-step.done .lp-step-icon { background: var(--accent-soft); border-color: var(--accent); }
.lp-step.done .lp-step-icon .icon { color: var(--accent); }
.lp-step.done .lp-step-label { color: var(--accent); }
.lp-step.active .lp-step-icon { background: var(--accent); border-color: var(--accent); animation: lpPulse 1.4s ease-in-out infinite; }
.lp-step.active .lp-step-icon .icon { color: #0a0b0f; }
.lp-step.active .lp-step-label { color: var(--text); font-weight: 700; }
.lp-step.failed .lp-step-icon { background: rgba(248,113,113,0.15); border-color: var(--danger); }
.lp-step.failed .lp-step-icon .icon { color: var(--danger); }
.lp-step.failed .lp-step-label { color: var(--danger); }

<div class="app-bg" id="appBg"></div>

<div class="app">
  <header class="titlebar">
    <div class="logo"><svg class="icon icon-sm"><use href="#i-hammer"/></svg></div>
    <div class="title-name" contenteditable="true" spellcheck="false" id="appTitle">BlockLauncher</div>
    <div class="spacer"></div>
    <div class="win-controls">
      <button class="win-btn"><svg class="icon icon-sm"><use href="#i-minus"/></svg></button>
      <button class="win-btn"><svg class="icon icon-sm"><use href="#i-square"/></svg></button>
      <button class="win-btn close"><svg class="icon icon-sm"><use href="#i-x"/></svg></button>
    </div>
  </header>

  <div class="view main active" id="mainView">
    <div class="left-col">
      <div class="account-card" id="accountCard" data-mode="offline">
        <button class="mode-row" id="modeRow"><span class="mode-icon" id="modeIcon"></span><span class="mode-name" id="modeName">离线</span></button>
        <div class="avatar-wrap"><div class="avatar-placeholder" id="avatarPlaceholder">?</div></div>
        <div class="name-row" id="nameRow"><input class="name-input" id="nameInput" type="text" placeholder="请输入玩家名" maxlength="16" spellcheck="false" autocomplete="off"></div>
        <div class="uuid-text empty" id="uuidText">—</div>
        <div class="uuid-sub" id="uuidSub"></div>
      </div>

      <div class="activity-panel" id="activityPanel">
        <div class="detector-view" id="detectorView" data-mode="expanded">
          <div class="detector-header" id="detectorHeader">
            <span class="detector-title">设备检测</span>
            <div class="detector-inline" id="detectorInline">
              <span class="detector-inline-item cpu"><svg class="icon"><use href="#i-cpu"/></svg><span id="detInlineCpu">12%</span></span>
              <span class="detector-inline-item mem"><svg class="icon"><use href="#i-chip"/></svg><span id="detInlineMem">62%</span></span>
              <span class="detector-inline-item disk"><svg class="icon"><use href="#i-hdd"/></svg><span id="detInlineDisk">78%</span></span>
            </div>
            <button class="detector-toggle"><svg class="icon"><use href="#i-chevron-up"/></svg></button>
          </div>
          <div class="detector-body">
            <div class="detector-card">
              <div class="detector-card-head"><span class="detector-card-label"><svg class="icon"><use href="#i-cpu"/></svg>CPU</span><span class="detector-card-value cpu" id="detCpuVal">12%</span></div>
              <div class="detector-bar cpu"><i id="detCpuBar" style="width:12%"></i></div>
            </div>
            <div class="detector-card">
              <div class="detector-card-head"><span class="detector-card-label"><svg class="icon"><use href="#i-chip"/></svg>RAM</span><span class="detector-card-value mem" id="detMemVal">62%</span></div>
              <div class="detector-bar mem"><i id="detMemBar" style="width:62%"></i></div>
            </div>
            <div class="detector-card">
              <div class="detector-card-head"><span class="detector-card-label"><svg class="icon"><use href="#i-hdd"/></svg>DISK</span><span class="detector-card-value disk" id="detDiskVal">78%</span></div>
              <div class="detector-bar disk warn" id="detDiskBarWrap"><i id="detDiskBar" style="width:78%"></i></div>
            </div>
          </div>
        </div>

        <div class="console-view" id="consoleView" data-mode="collapsed">
          <div class="console-head" id="consoleHead">
            <span class="console-dot" id="consoleDot"></span>
            <span class="console-label" id="consoleLabel">Console</span>
            <div class="console-badges" id="consoleBadges"></div>
            <button class="console-expand"><svg class="icon"><use href="#i-chevron-up"/></svg></button>
          </div>
          <div class="console-body" id="consoleBody"><div class="empty-hint">等待启动</div></div>
        </div>
      </div>

      <div class="version-selector-bar" id="versionSelector">
        <svg class="vsb-icon icon"><use href="#i-box"/></svg>
        <div class="vsb-info">
          <div class="vsb-label">当前版本</div>
          <div class="vsb-name" id="vsbName">Meteor Client</div>
        </div>
        <span class="vsb-meta" id="vsbMeta">1.21.4</span>
        <svg class="vsb-chevron icon icon-sm"><use href="#i-chevron-up"/></svg>
      </div>

      <div class="version-dock" id="versionDock">
        <div class="vdock-empty">暂无其他版本</div>
      </div>
    </div>

    <div class="right-col">
      <div class="carousel-wrap">
        <div class="carousel" id="carousel">
          <div class="carousel-track" id="carouselTrack">
            <div class="slide" data-type="version">
              <div class="version-card" id="versionCard">
                <div class="circuit-decoration" id="circuitDeco"></div>
                <div>
                  <div class="vc-name" id="vcName">Meteor Client</div>
                  <div class="vc-tags" id="vcTags"></div>
                  <div class="vc-ver" id="vcVer">1.21.4</div>
                  <div class="vc-sub" id="vcSub">JAVA EDITION</div>
                </div>
                <div class="vc-stats" id="vcStats"></div>
              </div>
            </div>
            <div class="slide" data-type="music">
              <div class="music-card">
                <div class="circuit-decoration" id="musicCircuitDeco"></div>
                <div class="album-art"><svg class="icon icon-lg"><use href="#i-music"/></svg></div>
                <div class="music-info">
                  <div><div class="song-title">Aria Math</div><div class="song-artist">C418 · Minecraft Volume Beta</div></div>
                  <div><div class="progress-bar"><div class="progress-fill"></div></div><div class="time-row"><span>2:14</span><span>5:02</span></div></div>
                  <div class="controls">
                    <button class="ctrl-btn"><svg class="icon icon-sm"><use href="#i-skip-prev"/></svg></button>
                    <button class="ctrl-btn play" id="playBtn"><svg class="icon icon-sm" id="playIcon"><use href="#i-play"/></svg></button>
                    <button class="ctrl-btn"><svg class="icon icon-sm"><use href="#i-skip-next"/></svg></button>
                  </div>
                </div>
              </div>
            </div>
            <div class="slide is-hidden" data-type="download">
              <div class="download-card">
                <div class="dl-card-head"><div class="dl-card-title">下载队列</div><div class="dl-card-status" id="dlCardStatus">全部完成</div></div>
                <div class="dl-task-list" id="dlTaskList"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="carousel-dots" id="carouselDots"></div>
      </div>
      <div class="fixed-area">
        <div class="mem-card">
          <div class="mem-head">
            <div class="mem-title">内存分配</div>
            <div class="mem-actions">
              <button class="icon-btn" id="advBtn" title="高级设置"><svg class="icon icon-sm"><use href="#i-sliders"/></svg></button>
              <button class="icon-btn" id="refreshBtn" title="刷新"><svg class="icon icon-sm"><use href="#i-refresh"/></svg></button>
              <button class="auto-btn on" id="autoBtn"><span class="auto-dot"></span>自动分配</button>
            </div>
          </div>
          <div class="mem-panel auto-mode" id="memPanel" data-status="safe">
            <div class="mem-track-wrap"><div class="mem-track" id="memTrack"><div class="mzone mzone-safe"></div><div class="mzone mzone-warn"></div><div class="mzone mzone-danger"></div><div class="mem-fill" id="memFill"></div><div class="mhandle mhandle-min" id="memHandleMin"></div><div class="mhandle mhandle-max" id="memHandleMax"></div></div></div>
            <div class="mem-scale"><span class="mscale-tick mscale-first">0</span><span class="mscale-tick mscale-mid" id="mscaleSafe">50%</span><span class="mscale-tick mscale-mid" id="mscaleWarn">80%</span><span class="mscale-tick mscale-last">120%</span></div>
            <div class="mem-values">
              <div class="mval-item"><div class="mval-label">Max</div><input class="mnum-input max-col" id="memMaxInput" type="number" value="3072" disabled></div>
              <div class="mval-item min-item" id="memMinItem"><div class="mval-label">Min</div><input class="mnum-input min-col" id="memMinInput" type="number" value="2048" disabled></div>
              <div class="mval-item free-item"><div class="mval-label">可用</div><div class="mval-static" id="memFreeVal">6144 MB</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="view instances-view" id="instancesView">
    <div class="instances-left">
      <div class="instances-head">
        <div class="instances-title">实例管理</div>
        <div class="instances-actions">
          <button class="btn" id="importInstanceBtn"><svg class="icon icon-sm"><use href="#i-import"/></svg>导入</button>
          <button class="btn btn-primary" id="newInstanceBtn"><svg class="icon icon-sm"><use href="#i-plus"/></svg>新建</button>
        </div>
      </div>
      <div class="inst-toolbar">
        <input class="inst-search" id="instSearch" placeholder="搜索...">
        <select class="inst-sort" id="instSort"><option value="default">默认顺序</option><option value="name">名称排序</option><option value="version">版本排序</option></select>
      </div>
      <div class="instances-list" id="instancesList"></div>
    </div>
    <div class="instances-right">
      <div class="inst-detail-empty" id="instDetailEmpty">
        <svg class="icon" style="width:48px;height:48px;opacity:0.2"><use href="#i-box"/></svg>
        <div>选择左侧实例查看详情</div>
      </div>
      <div id="instDetailPanel" style="display:none;"></div>
    </div>
  </div>

  <div class="view download-view" id="downloadView">
    <div class="download-left">
      <div class="dl-list" id="dlList">
        <button class="dl-row" data-cat="client">
          <svg class="icon"><use href="#i-gamepad"/></svg>
          <div class="dl-row-info"><div class="dl-row-name">下载游戏</div><div class="dl-row-desc">Minecraft 客户端</div></div>

/* ============================================================
   工具

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
}
function formatCount(n) {
  if (n == null) return '—';
  if (n >= 1e8) return (n / 1e8).toFixed(1) + '亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1) + '万';
  return String(n);
}
function formatSize(mb) {
  if (mb >= 1024) return (mb / 1024).toFixed(1) + ' GB';
  return Math.round(mb) + ' MB';
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function pad(n) { return String(n).padStart(2, '0'); }
function nowStr() { const d = new Date(); return `[${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}]`; }
function svg(name, cls = 'icon') { return `<svg class="${cls}"><use href="#i-${name}"/></svg>`; }

const Bus = {
  _h: {},
  on(evt, fn) { (this._h[evt] = this._h[evt] || []).push(fn); return () => this.off(evt, fn); },
  off(evt, fn) { const a = this._h[evt]; if (!a) return; const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); },
  emit(evt, data) { (this._h[evt] || []).forEach(fn => { try { fn(data); } catch (e) { console.error('[Bus]', evt, e); } }); }
};

/* ============================================================
   Paint
   ============================================================ */
const Paint = {
  solid: (color) => ({ type: 'solid', color }),
  linear: (angle, stops) => ({ type: 'linearGradient', angle, stops }),
  radial: (center, radius, stops) => ({ type: 'radialGradient', center, radius, stops }),
  acrylic: (tint, blur = 24) => ({ type: 'acrylic', tint, blur }),
  image: (source, opts = {}) => ({ type: 'image', source, fit: 'cover', blur: 0, brightness: 1, opacity: 1, ...opts })
};

function hexToRgba(hex, alpha) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function paintToCss(paint) {
  if (!paint) return 'transparent';
  switch (paint.type) {
    case 'solid': return paint.color;
    case 'linearGradient': {
      const angle = paint.angle ?? 135;
      const stops = (paint.stops || []).map(s => `${s.color} ${(s.offset * 100).toFixed(1)}%`).join(', ');
      return `linear-gradient(${angle}deg, ${stops})`;
    }
    case 'radialGradient': {
      const center = paint.center || 'center';
      const size = paint.radius ? `${paint.radius}px` : '60%';
      const stops = (paint.stops || []).map(s => `${s.color} ${(s.offset * 100).toFixed(1)}%`).join(', ');
      return `radial-gradient(circle ${size} at ${center}, ${stops})`;
    }
    case 'acrylic': return paint.tint;
    case 'image': return paint.tint ? `linear-gradient(${paint.tint}, ${paint.tint})` : 'transparent';
    default: return 'transparent';
  }
}

function compileTextPaint(paint, fallbackColor) {
  const type = paint?.type;
  if (!paint || type === 'solid') {
    const color = paint?.color || fallbackColor;
    return { color, bg: 'none', clip: 'border-box', fill: color };
  }
  if (type === 'linearGradient') {
    const angle = paint.angle ?? 135;
    const stops = (paint.stops || []).map(s => `${s.color} ${(s.offset * 100).toFixed(1)}%`).join(', ');
    return { color: 'transparent', bg: `linear-gradient(${angle}deg, ${stops})`, clip: 'text', fill: 'transparent' };
  }
  return { color: fallbackColor, bg: 'none', clip: 'border-box', fill: fallbackColor };
}

/* 每个主题的电路板装饰 SVG pattern（data URI） */
function makeCircuitSvg(color, style = 'industrial') {
  let inner;
  if (style === 'ocean') {
    inner = `
      <path d="M0 30 Q30 30 30 60 T60 90" fill="none" stroke="${color}" stroke-width="1"/>
      <path d="M100 10 Q100 50 130 50 T160 80" fill="none" stroke="${color}" stroke-width="1"/>
      <path d="M180 20 Q160 40 180 60 T200 100" fill="none" stroke="${color}" stroke-width="1"/>
      <circle cx="30" cy="60" r="2.5" fill="${color}"/>
      <circle cx="130" cy="50" r="2.5" fill="${color}"/>
      <circle cx="180" cy="60" r="2.5" fill="${color}"/>
    `;
  } else if (style === 'neon') {
    inner = `
      <path d="M20 0 V40 H80 V80" fill="none" stroke="${color}" stroke-width="1.5"/>
      <path d="M120 0 V60 H60 V120" fill="none" stroke="${color}" stroke-width="1.5"/>
      <path d="M180 20 H140 V100 H200" fill="none" stroke="${color}" stroke-width="1.5"/>
      <circle cx="80" cy="80" r="3" fill="${color}"/>
      <circle cx="60" cy="60" r="3" fill="${color}"/>
      <circle cx="140" cy="100" r="3" fill="${color}"/>
    `;
  } else {
    // industrial - 直角 + 焊点
    inner = `
      <path d="M30 0 V30 H90 V80 H140" fill="none" stroke="${color}" stroke-width="1"/>
      <path d="M0 60 H40 V120" fill="none" stroke="${color}" stroke-width="1"/>
      <path d="M120 0 V50 H200 V100" fill="none" stroke="${color}" stroke-width="1"/>
      <path d="M170 20 H210 V80" fill="none" stroke="${color}" stroke-width="1"/>
      <circle cx="90" cy="30" r="2" fill="${color}"/>
      <circle cx="90" cy="80" r="2" fill="${color}"/>
      <circle cx="140" cy="80" r="2" fill="${color}"/>
      <circle cx="40" cy="60" r="2" fill="${color}"/>
      <circle cx="120" cy="50" r="2" fill="${color}"/>
      <circle cx="170" cy="80" r="2" fill="${color}"/>
      <rect x="180" y="90" width="6" height="6" fill="${color}" opacity="0.5"/>
      <rect x="0" y="110" width="4" height="4" fill="${color}" opacity="0.5"/>
    `;
  }
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='220' height='140' viewBox='0 0 220 140'>${inner}</svg>`;
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
}

/* ============================================================
   ThemeCompiler
   ============================================================ */
function compileTheme(theme) {
  const c = theme.foundation.color;
  const s = theme.surfaces;
  const display = compileTextPaint(theme.text.display, c.text);
  const headline = compileTextPaint(theme.text.headline, c.text);
  const vars = {
    'accent': c.accent,
    'accent-2': c.accent2,
    'accent-soft': hexToRgba(c.accent, 0.10),
    'accent-border': hexToRgba(c.accent, 0.22),
    'accent-grad': paintToCss(Paint.linear(135, [
      { offset: 0, color: c.accent }, { offset: 1, color: c.accent2 }
    ])),
    'ok': c.ok, 'warn': c.warn, 'danger': c.danger, 'info': c.info,
    'text': c.text, 'text-2': c.text2, 'text-3': c.text3,
    'bg': paintToCss(theme.background[0] || Paint.solid('#090a0e')),
    'bg-2': 'rgba(0,0,0,0.3)',
    'surface-card-bg': paintToCss(s.card.paint),
    'surface-card-border': s.card.border,
    'surface-panel-bg': paintToCss(s.panel.paint),
    'surface-panel-border': s.panel.border,
    'surface-dock-bg': paintToCss(s.dock.paint),
    'surface-dock-blur': s.dock.paint.type === 'acrylic' ? `blur(${s.dock.paint.blur}px)` : 'none',
    'surface-modal-bg': paintToCss(s.modal.paint),
    'surface-modal-border': s.modal.border,
    'surface-input-bg': paintToCss(s.input.paint),
    'surface-input-border': s.input.border,
    'surface': 'transparent',
    'surface-2': hexToRgba(c.text, 0.045),
    'border': hexToRgba(c.text, 0.06),
    'border-hi': hexToRgba(c.text, 0.12),
    'text-display-color': display.color,
    'text-display-bg': display.bg,
    'text-display-clip': display.clip,
    'text-display-fill': display.fill,
    'text-headline-color': headline.color,
    'text-headline-bg': headline.bg,
    'text-headline-clip': headline.clip,
    'text-headline-fill': headline.fill,
    'radius-card': theme.foundation.shape.radiusCard + 'px',
    'radius-small': theme.foundation.shape.radiusSmall + 'px',
    'radius': theme.foundation.shape.radiusCard + 'px',
    'circuit-stroke': hexToRgba(c.accent, 0.15)
  };
  if (theme.foundation.greys) {
    Object.entries(theme.foundation.greys).forEach(([k, v]) => {
      vars['grey-' + k] = v;
    });
  }
  let css = ':root {\n';
  for (const [k, v] of Object.entries(vars)) css += `  --${k}: ${v};\n`;
  css += '}\n';
  return css;
}

/* ============================================================
   BackgroundRenderer
   ============================================================ */
function renderBackground(layers) {
  const bg = document.getElementById('appBg');
  bg.innerHTML = '';
  layers.forEach(layer => {
    const el = document.createElement('div');
    el.className = 'bg-layer';
    if (layer.type === 'image') {
      el.style.backgroundImage = layer.tint
        ? `linear-gradient(${layer.tint}, ${layer.tint}), url("${layer.source}")`
        : `url("${layer.source}")`;
      el.style.backgroundSize = layer.fit === 'contain' ? 'contain' : layer.fit === 'tile' ? 'auto' : 'cover';
      el.style.backgroundPosition = 'center';
      el.style.backgroundRepeat = layer.fit === 'tile' ? 'repeat' : 'no-repeat';
      const filters = [];
      if (layer.blur) filters.push(`blur(${layer.blur}px)`);
      if (layer.brightness != null && layer.brightness !== 1) filters.push(`brightness(${layer.brightness})`);
      if (filters.length) el.style.filter = filters.join(' ');
      if (layer.opacity != null) el.style.opacity = layer.opacity;
    } else {
      el.style.background = paintToCss(layer);
    }
    bg.appendChild(el);
  });
}

function renderCircuitDecorations(theme) {
  const deco = document.getElementById('circuitDeco');
  const mdeco = document.getElementById('musicCircuitDeco');
  const style = theme.id === 'ocean' ? 'ocean' : theme.id === 'neon' ? 'neon' : 'industrial';
  const color = style === 'industrial' ? 'rgba(245,158,11,0.6)' : style === 'neon' ? 'rgba(0,240,255,0.7)' : 'rgba(125,211,252,0.6)';
  const pattern = makeCircuitSvg(color, style);
  if (deco) deco.style.backgroundImage = pattern;
  if (mdeco) mdeco.style.backgroundImage = pattern;
}

/* ============================================================
   ThemeService
   ============================================================ */
const ThemeService = {
  current: null,
  _styleEl: null,
  init() {
    this._styleEl = document.getElementById('theme-styles');
    this.current = this.load() || this.clonePreset('ocean');
    this.apply(this.current);
  },
  clonePreset(id) { return JSON.parse(JSON.stringify(PRESET_THEMES[id])); },
  apply(theme) {
    this.current = theme;
    this._styleEl.textContent = compileTheme(theme);
    renderBackground(theme.background);
    renderCircuitDecorations(theme);
    Bus.emit('theme:changed', theme);
  },
  save(theme = this.current) {
    try { localStorage.setItem(KEY_THEME, JSON.stringify(theme)); return true; }
    catch (e) { return false; }
  },
  load() {
    try { const s = localStorage.getItem(KEY_THEME); return s ? JSON.parse(s) : null; }
    catch (e) { return null; }
  },
  reset() {
    localStorage.removeItem(KEY_THEME);
    this.current = this.clonePreset('ocean');
    this.apply(this.current);
  },
  exportJson() { return JSON.stringify(this.current, null, 2); },
  importJson(json) {
    try {
      const t = JSON.parse(json);
      if (!t.foundation || !t.surfaces || !t.background) throw new Error('Schema');
      this.current = t;
      this.apply(t);
      this.save(t);
      return true;
    } catch (e) { return false; }
  }
};

function toast(msg, type = 'info', duration = 2800) {
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="toast-dot"></span><span>${escapeHtml(msg)}</span>`;
  root.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, duration);
}
function showConfirm({ title, desc, okText = '确定', cancelText = '取消', danger = false }) {
  return new Promise(resolve => {
    const root = document.getElementById('modalRoot');
    root.innerHTML = `
      <div class="modal">
        <div class="modal-title">${escapeHtml(title)}</div>
        ${desc ? `<div class="modal-desc">${escapeHtml(desc)}</div>` : ''}
        <div class="modal-actions">
          <button class="modal-btn" data-act="cancel">${escapeHtml(cancelText)}</button>
          <button class="modal-btn ${danger ? 'danger' : 'primary'}" data-act="ok">${escapeHtml(okText)}</button>
        </div>
      </div>`;
    root.classList.add('show');
    const close = (v) => { root.classList.remove('show'); root.innerHTML = ''; resolve(v); };
    root.querySelector('[data-act="cancel"]').onclick = () => close(false);
    root.querySelector('[data-act="ok"]').onclick = () => close(true);
    root.onclick = (e) => { if (e.target === root) close(false); };
  });
}
function showPrompt({ title, label, value = '', placeholder = '', validate = null, okText = '确定', cancelText = '取消' }) {
  return new Promise(resolve => {
    const root = document.getElementById('modalRoot');
    root.innerHTML = `
      <div class="modal">
        <div class="modal-title">${escapeHtml(title)}</div>
        ${label ? `<div class="modal-desc">${escapeHtml(label)}</div>` : ''}
        <input class="modal-input" id="promptInput" value="${escapeHtml(value)}" placeholder="${escapeHtml(placeholder)}">
        <div class="modal-error" id="promptError"></div>
        <div class="modal-actions">
          <button class="modal-btn" data-act="cancel">${escapeHtml(cancelText)}</button>
          <button class="modal-btn primary" data-act="ok">${escapeHtml(okText)}</button>
        </div>
      </div>`;
    root.classList.add('show');
    const input = root.querySelector('#promptInput');
    const error = root.querySelector('#promptError');
    input.focus(); input.select();
    const close = (v) => { root.classList.remove('show'); root.innerHTML = ''; resolve(v); };
    const submit = () => {
      const v = input.value.trim();
      const err = validate ? validate(v) : null;
      if (err) { error.textContent = err; return; }
      close(v);
    };
    root.querySelector('[data-act="cancel"]').onclick = () => close(null);
    root.querySelector('[data-act="ok"]').onclick = submit;
    input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } if (e.key === 'Escape') close(null); };
    root.onclick = (e) => { if (e.target === root) close(null); };
  });
}

function showCtxMenu(x, y, items) {
  const root = document.getElementById('ctxRoot');
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.innerHTML = items.map(item => item.sep ? '<div class="ctx-sep"></div>' : `<button class="ctx-item ${item.danger ? 'danger' : ''}" ${item.disabled ? 'disabled' : ''}>${escapeHtml(item.label)}</button>`).join('');
  root.innerHTML = ''; root.appendChild(menu); root.classList.add('show');
  const w = menu.offsetWidth, h = menu.offsetHeight;
  root.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
  root.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
  const close = () => { root.classList.remove('show'); root.innerHTML = ''; document.removeEventListener('click', close); document.removeEventListener('contextmenu', close, true); };
  const btns = menu.querySelectorAll('.ctx-item');
  let i = 0;
  items.forEach(item => {
    if (item.sep) return;
    const btn = btns[i++];
    btn.onclick = (e) => { e.stopPropagation(); if (item.disabled) return; close(); item.onClick && item.onClick(); };
  });
  setTimeout(() => { document.addEventListener('click', close); document.addEventListener('contextmenu', close, true); }, 0);
}

function offlineUUID(name) {
  const h = md5('OfflinePlayer:' + name);
  const b = [];
  for (let i = 0; i < 32; i += 2) b.push(parseInt(h.substr(i, 2), 16));
  b[6] = (b[6] & 0x0f) | 0x30; b[8] = (b[8] & 0x3f) | 0x80;
  const s = b.map(v => ('0' + v.toString(16)).slice(-2)).join('');
  return s.slice(0,8) + '-' + s.slice(8,12) + '-' + s.slice(12,16) + '-' + s.slice(16,20) + '-' + s.slice(20);
}
function loadImage(url, timeout = 6000) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    const timer = setTimeout(() => reject(new Error('timeout')), timeout);
    img.onload = () => { clearTimeout(timer); resolve(img); };
    img.onerror = () => { clearTimeout(timer); reject(new Error('load failed')); };
    img.src = url;
  });
}
function renderHeadCanvas(skinImg) {
  const canvas = document.createElement('canvas');
  canvas.width = 10; canvas.height = 10; canvas.className = 'avatar-canvas';
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(skinImg, 8, 8, 8, 8, 1, 1, 8, 8);
  if (skinImg.height >= 64) ctx.drawImage(skinImg, 40, 8, 8, 8, 0, 0, 10, 10);
  try {
    const data = ctx.getImageData(0, 0, 10, 10).data;
    for (let i = 3; i < data.length; i += 4) if (data[i] > 8) return canvas;
    return null;
  } catch (e) { return canvas; }
}
let avatarToken = 0;
async function renderAvatar(requestName) {
  const myToken = ++avatarToken;
  const v = (requestName || '').trim();
  avatarWrap.querySelectorAll('.avatar-canvas').forEach(c => c.remove());
  if (!v) { avatarPlaceholder.textContent = '?'; avatarPlaceholder.style.display = 'flex'; return; }
  avatarPlaceholder.textContent = v.charAt(0).toUpperCase();
  avatarPlaceholder.style.display = 'flex';
  try {
    const img = await loadImage(`https://mc-heads.net/skin/${encodeURIComponent(v)}`);
    if (myToken !== avatarToken) return;
    const canvas = renderHeadCanvas(img);
    if (!canvas) { avatarPlaceholder.style.display = 'flex'; return; }
    avatarPlaceholder.style.display = 'none';
    avatarWrap.appendChild(canvas);
  } catch (e) {
    if (myToken !== avatarToken) return;
    avatarPlaceholder.style.display = 'flex';
  }
}

/* ============================================================
   内存卡
   ============================================================ */
let SYSTEM_FREE = 6144, MAX_MB = SYSTEM_FREE * 1.2;
let memAutoMode = true, memAdvMode = false;
function computeAuto() {
  const usable = Math.max(1024, SYSTEM_FREE - 2048);
  let aMax = Math.floor((usable * 0.6) / 512) * 512;
  aMax = Math.max(1024, Math.min(8192, aMax));
  let aMin = Math.ceil((aMax * 0.5) / 256) * 256;
  return { autoMin: Math.min(aMin, aMax), autoMax: aMax };
}
const memInit = computeAuto();
let mMin = memInit.autoMin, mMax = memInit.autoMax;
const SNAP_ENTER = 3, SNAP_BREAK = 12;
let memStuck = null, memStuckStartX = 0, memLastBroken = null;
const memPanel = document.getElementById('memPanel');
const memTrack = document.getElementById('memTrack');
const memHandleMin = document.getElementById('memHandleMin');
const memHandleMax = document.getElementById('memHandleMax');
const memFill = document.getElementById('memFill');
const memMinInput = document.getElementById('memMinInput');
const memMaxInput = document.getElementById('memMaxInput');
const memFreeVal = document.getElementById('memFreeVal');
const mzoneSafe = document.querySelector('.mzone-safe');
const mzoneWarn = document.querySelector('.mzone-warn');
const mzoneDanger = document.querySelector('.mzone-danger');
const autoBtn = document.getElementById('autoBtn');
const refreshBtn = document.getElementById('refreshBtn');
const advBtn = document.getElementById('advBtn');
function snapInterval() {
  if (SYSTEM_FREE >= 16384) return 2048;
  if (SYSTEM_FREE >= 8192) return 1024;
  if (SYSTEM_FREE >= 4096) return 512;
  if (SYSTEM_FREE >= 2048) return 256;
  return 128;
}
function memStatus() {
  const r = mMax / SYSTEM_FREE;
  if (r <= 0.5) return 'safe';
  if (r <= 0.8) return 'warn';
  return 'danger';
}
function layoutZones() {
  const safePos = (SYSTEM_FREE * 0.5) / MAX_MB * 100;
  const warnPos = (SYSTEM_FREE * 0.8) / MAX_MB * 100;
  mzoneSafe.style.left = '0%'; mzoneSafe.style.width = safePos + '%';
  mzoneWarn.style.left = safePos + '%'; mzoneWarn.style.width = (warnPos - safePos) + '%';
  mzoneDanger.style.left = warnPos + '%'; mzoneDanger.style.width = (100 - warnPos) + '%';
  document.getElementById('mscaleSafe').style.left = safePos + '%';
  document.getElementById('mscaleWarn').style.left = warnPos + '%';
}
function updateMemUI() {
  const pMin = (mMin / MAX_MB) * 100, pMax = (mMax / MAX_MB) * 100;
  memHandleMin.style.left = pMin + '%'; memHandleMax.style.left = pMax + '%';
  if (memAdvMode) { memFill.style.left = pMin + '%'; memFill.style.width = Math.max(0, pMax - pMin) + '%'; }
  else { memFill.style.left = '0%'; memFill.style.width = pMax + '%'; }
  const eq = mMin === mMax;
  if (memAdvMode && eq) { memHandleMin.classList.add('eq'); memHandleMax.classList.add('eq'); }
  else { memHandleMin.classList.remove('eq'); memHandleMax.classList.remove('eq'); }
  if (document.activeElement !== memMinInput) memMinInput.value = Math.round(mMin);
  if (document.activeElement !== memMaxInput) memMaxInput.value = Math.round(mMax);
  memFreeVal.textContent = SYSTEM_FREE + ' MB';
  memPanel.classList.toggle('auto-mode', memAutoMode);
  memPanel.classList.toggle('adv-on', memAdvMode);
  memPanel.setAttribute('data-status', memAutoMode ? 'safe' : memStatus());
  memMinInput.disabled = memAutoMode; memMaxInput.disabled = memAutoMode;
}
function bindMemDrag(which) {
  const handle = which === 'min' ? memHandleMin : memHandleMax;
  handle.addEventListener('pointerdown', e => {
    if (which === 'min' && (memAutoMode || !memAdvMode)) return;
    e.preventDefault(); e.stopPropagation();
    handle.classList.add('dragging');
    memStuck = null; memLastBroken = null;
    let moved = false;
    const onMove = ev => {
      if (!moved) { moved = true; if (memAutoMode) { memAutoMode = false; autoBtn.classList.remove('on'); updateMemUI(); } }
      const rect = memTrack.getBoundingClientRect();
      const raw = Math.max(0, Math.min(MAX_MB, (ev.clientX - rect.left) / rect.width * MAX_MB));
      const snap = snapInterval();
      const nearest = Math.round(raw / snap) * snap;
      const distPx = Math.abs(raw - nearest) / MAX_MB * rect.width;
      let fv;
      if (memStuck !== null) {
        if (Math.abs(ev.clientX - memStuckStartX) >= SNAP_BREAK) { memLastBroken = memStuck; memStuck = null; fv = raw; }
        else fv = memStuck;
      } else {
        if (distPx <= SNAP_ENTER && nearest !== memLastBroken && nearest >= 0 && nearest <= MAX_MB) { memStuck = nearest; memStuckStartX = ev.clientX; fv = nearest; }
        else { fv = raw; if (nearest !== memLastBroken) memLastBroken = null; }
      }
      if (which === 'min') { if (fv > mMax) mMax = fv; mMin = fv; }
      else { if (fv < mMin) mMin = fv; mMax = fv; }
      updateMemUI();
    };
    const onUp = () => { handle.classList.remove('dragging'); memStuck = null; memLastBroken = null; document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp); };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}
bindMemDrag('min'); bindMemDrag('max');
memMinInput.addEventListener('input', () => {
  if (memAutoMode || !memAdvMode) return;
  let v = parseFloat(memMinInput.value) || 0; v = Math.max(0, Math.min(MAX_MB, v)); if (v > mMax) v = mMax;
  mMin = v; updateMemUI();
});
memMaxInput.addEventListener('input', () => {
  if (memAutoMode) return;
  let v = parseFloat(memMaxInput.value) || 0; v = Math.max(0, Math.min(MAX_MB, v)); if (v < mMin) v = mMin;
  mMax = v; updateMemUI();
});
autoBtn.addEventListener('click', () => {
  memAutoMode = !memAutoMode;
  autoBtn.classList.toggle('on', memAutoMode);
  if (memAutoMode) { const v = computeAuto(); mMin = v.autoMin; mMax = v.autoMax; }
  updateMemUI();
});
advBtn.addEventListener('click', () => { memAdvMode = !memAdvMode; advBtn.classList.toggle('adv-on', memAdvMode); updateMemUI(); });
refreshBtn.addEventListener('click', () => {
  const delta = Math.round((Math.random() - 0.5) * 1024 / 128) * 128;
  SYSTEM_FREE = Math.max(2048, Math.min(32768, SYSTEM_FREE + delta));
  MAX_MB = SYSTEM_FREE * 1.2;
  layoutZones();
  if (memAutoMode) { const v = computeAuto(); mMin = v.autoMin; mMax = v.autoMax; }
  else { mMin = Math.min(mMin, MAX_MB); mMax = Math.min(mMax, MAX_MB); if (mMax < mMin) mMax = mMin; }
  memHandleMin.classList.add('smooth'); memHandleMax.classList.add('smooth');
  updateMemUI();
  setTimeout(() => { memHandleMin.classList.remove('smooth'); memHandleMax.classList.remove('smooth'); }, 450);
});
layoutZones(); updateMemUI();

function bindLaunchButton(steps) {
  const btn = document.getElementById('launchBtn');
  if (!btn) return;
  let holdTimer = null;
  let holding = false;
  let holdStart = 0;
  const HOLD_MS = 500;

  const startHold = (e) => {
    e.preventDefault();
    if (LAUNCHING.active) return;
    holding = true;
    holdStart = Date.now();
    btn.classList.add('holding');
    holdTimer = setTimeout(() => {
      if (!holding) return;
      holding = false;
      btn.classList.remove('holding');
      startLaunch(steps);
    }, HOLD_MS);
  };
  const cancelHold = () => {
    if (!holding) return;
    holding = false;
    btn.classList.remove('holding');
    clearTimeout(holdTimer);
  };

  btn.addEventListener('pointerdown', startHold);
  btn.addEventListener('pointerup', cancelHold);
  btn.addEventListener('pointercancel', cancelHold);
  btn.addEventListener('pointerleave', cancelHold);
}

async function startLaunch(steps) {
  if (LAUNCHING.active) return;
  const inst = INSTANCES.find(i => i.id === CURRENT_ID);
  if (!inst) return;

  LAUNCHING = { active: true, id: inst.id, phase: 0, steps, failed: false };
  // 禁用版本选择
  updateVersionSelector();
  buildVersionDock();
  closeVersionDock();

  // 展开控制台
  setActivityMode('console');
  clearConsole();
  consoleDot.classList.add('active');
  consoleLabel.textContent = 'Preflight';

  const stepMessages = [
    ['INFO', `读取实例：${inst.name}`],
    ['INFO', `目标版本 ${inst.mcVersion} · ${inst.type === 'server' ? (inst.serverType?.toUpperCase() + ' 服务端') : (LOADER_NAMES[inst.loader] || inst.loader)}`],
    ['INFO', inst.type === 'server' ? '准备服务端 jar 与配置...' : '准备 classpath 与依赖...'],
    ['INFO', '启动 Java 进程...']
  ];

  for (let i = 0; i < steps.length; i++) {
    LAUNCHING.phase = i;
    renderVersionCard();
    logLine(stepMessages[i][0], stepMessages[i][1]);
    await sleep(500 + Math.random() * 500);
    // 模拟偶发失败
    if (Math.random() < 0.03 && i === 1) {
      LAUNCHING.failed = true;
      renderVersionCard();
      logLine('ERR', '下载失败：网络超时');
      consoleDot.classList.remove('active');
      toast(`${inst.name} 启动失败`, 'error');
      await sleep(1500);
      LAUNCHING = { active: false, id: null, phase: 0, steps: [], failed: false };
      consoleLabel.textContent = 'Console';
      renderVersionCard();
      return;
    }
  }

  LAUNCHING.phase = steps.length;
  renderVersionCard();
  consoleDot.classList.remove('active');
  consoleDot.classList.add('running');
  consoleLabel.textContent = 'Running';
  logLine('OK', `游戏进程已启动 (PID ${8000 + Math.floor(Math.random()*900)})`);
  toast(`${inst.name} 已启动`, 'success');

  // 更新 lastPlayed
  inst.lastPlayed = '刚刚';
  saveInstances(INSTANCES);

  // 保持进度条一会儿，然后重置
  setTimeout(() => {
    LAUNCHING = { active: false, id: null, phase: 0, steps: [], failed: false };
    consoleDot.classList.remove('running');
    consoleLabel.textContent = 'Console';
    renderVersionCard();
  }, 3000);
}

const carousel = document.getElementById('carousel');
const track = document.getElementById('carouselTrack');
const dotsEl = document.getElementById('carouselDots');
const dlTaskList = document.getElementById('dlTaskList');
const dlCardStatus = document.getElementById('dlCardStatus');
let carouselIdx = 0;
function visibleTypes() {
  const types = ['version', 'music'];
  if (INSTANCES.some(i => i.status === 'downloading')) types.push('download');

}
function renderDownloadCard() {

  }
}
function renderCarousel() {
  const types = visibleTypes();
  if (carouselIdx >= types.length) carouselIdx = types.length - 1;
  if (carouselIdx < 0) carouselIdx = 0;
  document.querySelectorAll('.carousel .slide').forEach(s => {
    s.classList.toggle('is-hidden', !types.includes(s.dataset.type));
  });
  track.style.transform = `translateX(-${carouselIdx * 100}%)`;
  const hasActiveDl = INSTANCES.some(i => i.status === 'downloading');
  dotsEl.innerHTML = types.map((t, i) => {
    let cls = 'cdot';
    if (i === carouselIdx) cls += ' active';
    else if (t === 'download' && hasActiveDl) cls += ' breathing';
    return `<span class="${cls}" data-i="${i}"></span>`;
  }).join('');
  dotsEl.querySelectorAll('.cdot').forEach(d => {
    d.addEventListener('click', () => { carouselIdx = parseInt(d.dataset.i); renderCarousel(); });
  });
}
let cDrag = false, cDragged = false, cStartX = 0, cCurX = 0, cStartTime = 0, cWidth = 0;
carousel.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  cDrag = true; cDragged = false;
  cStartX = e.clientX; cCurX = 0; cStartTime = Date.now();
  cWidth = carousel.clientWidth;
  track.classList.add('dragging');
  document.addEventListener('pointermove', onCarouselMove);
  document.addEventListener('pointerup', onCarouselUp);
});
function onCarouselMove(e) {
  if (!cDrag) return;
  cCurX = e.clientX - cStartX;
  if (Math.abs(cCurX) > 8) cDragged = true;
  const types = visibleTypes();
  const base = -carouselIdx * cWidth;
  let offset = base + cCurX;
  const minOff = -(types.length - 1) * cWidth;
  if (offset > 0) offset = offset * 0.35;
  if (offset < minOff) offset = minOff + (offset - minOff) * 0.35;
  track.style.transform = `translateX(${offset}px)`;
}
function onCarouselUp() {
  if (!cDrag) return;
  cDrag = false;
  track.classList.remove('dragging');
  document.removeEventListener('pointermove', onCarouselMove);
  document.removeEventListener('pointerup', onCarouselUp);
  const wasDragged = cDragged;
  const dur = Date.now() - cStartTime;
  const vel = cCurX / Math.max(dur, 1);
  const th = cWidth * 0.22;
  if (cCurX < -th || (vel < -0.5 && cCurX < -30)) carouselIdx++;
  else if (cCurX > th || (vel > 0.5 && cCurX > 30)) carouselIdx--;
  renderCarousel();
  cCurX = 0; cDragged = false;
  if (!wasDragged) {
    const vc = event.target && event.target.closest ? event.target.closest('.version-card') : null;
    if (vc) {
      const inst = INSTANCES.find(i => i.id === CURRENT_ID);
      if (inst) {
        INST_DETAIL_ID = inst.id;
        setView('instances');
        renderInstancesList();
        renderInstanceDetail(inst.id);
      }
    }
  }
}

async function deleteInstance(id) {

function retryInstance(id) {
  const inst = INSTANCES.find(i => i.id === id);
  if (!inst || inst.status !== 'failed') return;
  inst.status = 'downloading'; inst.downloadProgress = 0; inst.failReason = null;
  saveInstances(INSTANCES);
  simulateDownload(id);
  toast(`正在重试「${inst.name}」`, 'info');

async function cancelInstance(id) {
  const inst = INSTANCES.find(i => i.id === id);
  if (!inst || inst.status !== 'downloading') return;
  const ok = await showConfirm({ title: '取消创建', desc: `确定要取消「${inst.name}」吗？`, okText: '取消创建', danger: true });
  if (!ok) return;
  inst.status = 'failed'; inst.failReason = '已取消';
  saveInstances(INSTANCES);
  toast('已取消创建', 'info');
  renderInstanceDetail(id);
}
function simulateDownload(instanceId) {
  const interval = setInterval(() => {
    const inst = INSTANCES.find(i => i.id === instanceId);
    if (!inst || inst.status !== 'downloading') { clearInterval(interval); return; }
    if (Math.random() < 0.04 && (inst.downloadProgress || 0) > 15) {
      inst.status = 'failed'; inst.failReason = '网络超时';
      saveInstances(INSTANCES);
      clearInterval(interval);
      toast(`实例「${inst.name}」创建失败`, 'error');
      return;
    }
    inst.downloadProgress = Math.min(100, (inst.downloadProgress || 0) + Math.random() * 12);
    if (inst.downloadProgress >= 100) {
      inst.downloadProgress = 100; inst.status = 'ready'; inst.health = 'green'; inst.lastPlayed = '';
      if (!inst.diskMB) inst.diskMB = inst.type === 'server' ? 500 + Math.floor(Math.random()*500) : 1500 + Math.floor(Math.random()*3000);
      saveInstances(INSTANCES);
      clearInterval(interval);
      setCurrentId(instanceId);
      toast(`实例「${inst.name}」创建成功`, 'success');
    } else {
      saveInstances(INSTANCES);
    }
  }, 400);
}

/* ============================================================
   API
   ============================================================ */
const ApiService = (() => {
  const cache = new Map();
  let currentAbort = null;
  function abortPrevious() { if (currentAbort) { currentAbort.abort(); currentAbort = null; } }
  async function fetchJson(url, { signal, timeout = 12000 } = {}) {
    if (cache.has(url)) {
      const entry = cache.get(url);
      if (entry instanceof Promise) return entry;
      return entry;
    }
    const controller = new AbortController();
    const mergedSignal = signal
      ? (() => {
          const c = new AbortController();
          signal.addEventListener('abort', () => c.abort());
          controller.signal.addEventListener('abort', () => c.abort());
          return c.signal;
        })()
      : controller.signal;
    const promise = (async () => {
      const timer = setTimeout(() => controller.abort(), timeout);
      try {
        const res = await fetch(url, { signal: mergedSignal });
        if (!res.ok) {
          let errMsg = `HTTP ${res.status}`;
          try { const err = await res.json(); if (err.description) errMsg += `: ${err.description}`; } catch (e) {}
          throw new Error(errMsg);
        }
        const json = await res.json();
        clearTimeout(timer);
        cache.set(url, json);
        return json;
      } catch (e) {
        clearTimeout(timer);
        if (cache.get(url) instanceof Promise) cache.delete(url);
        throw e;
      }
    })();
    cache.set(url, promise);
    return promise;
  }
  async function fetchMojangVersions() {
    const data = await fetchJson('https://launchermeta.mojang.com/mc/game/version_manifest_v2.json');
    const groups = { release: [], snapshot: [], old_beta: [], old_alpha: [] };
    for (const v of data.versions || []) {
      const g = v.type === 'release' ? 'release' : v.type === 'snapshot' ? 'snapshot' : v.type === 'old_beta' ? 'old_beta' : 'old_alpha';
      groups[g].push({ id: v.id, date: v.releaseTime?.slice(0, 10) || '', type: v.type });
    }
    return groups;
  }
  async function fetchFabricLoaders(mcVersion) {
    try {
      const data = await fetchJson(`https://meta.fabricmc.net/v2/versions/loader/${encodeURIComponent(mcVersion)}`);
      return (data || []).map(item => item.loader?.version).filter(Boolean);
    } catch (e) { return []; }
  }
  async function fetchNeoForgeVersions() {
    try {
      const data = await fetchJson('https://maven.neoforged.net/api/maven/versions/releases/net/neoforged/neoforge');
      return (data.versions || []).slice().reverse();
    } catch (e) { return []; }
  }
  async function fetchForgePromotions() {
    try { return await fetchJson('https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json'); }
    catch (e) { return { promos: {} }; }
  }
  async function fetchPaperVersions() {
    try {
      const data = await fetchJson('https://api.papermc.io/v2/projects/paper');
      return data.versions || [];
    } catch (e) { return []; }
  }
  async function fetchPaperBuilds(version) {
    try {
      const data = await fetchJson(`https://api.papermc.io/v2/projects/paper/versions/${encodeURIComponent(version)}/builds`);
      const builds = (data.builds || []).filter(b => b.channel === 'default').slice(-5).reverse();
      return builds.map(b => ({ id: b.build, version, channel: b.channel }));
    } catch (e) { return []; }
  }
  const MODRINTH_TYPE = { mod:'mod', modpack:'modpack', resourcepack:'resourcepack', shader:'shader', datapack:'datapack' };
  async function searchModrinth({ type = 'mod', query = '', mcVersion = '', loader = '', offset = 0, limit = 20 } = {}) {
    abortPrevious();
    currentAbort = new AbortController();
    const facets = [];
    const pt = MODRINTH_TYPE[type] || 'mod';
    if (pt) facets.push([`project_type:${pt}`]);
    if (mcVersion) facets.push([`versions:${mcVersion}`]);
    if (loader) facets.push([`categories:${loader}`]);
    const params = new URLSearchParams();
    params.set('limit', String(limit));
    params.set('offset', String(offset));
    params.set('index', 'downloads');
    if (query) params.set('query', query);
    if (facets.length > 0) params.set('facets', JSON.stringify(facets));
    const data = await fetchJson(`https://api.modrinth.com/v2/search?${params}`, { signal: currentAbort.signal });
    return {
      hits: (data.hits || []).map(h => ({
        id: h.project_id, name: h.title, author: h.author, description: h.description,
        downloads: h.downloads, follows: h.follows, icon: h.icon_url, source: 'Modrinth'
      })),
      total: data.total_hits || 0, offset
    };
  }
  return { fetchMojangVersions, fetchFabricLoaders, fetchNeoForgeVersions, fetchForgePromotions, fetchPaperVersions, fetchPaperBuilds, searchModrinth, fetchJson };
})();

async function renderResourceList(append = false) {
  if (DOWNLOAD_PAGE_STATE.loading || DOWNLOAD_PAGE_STATE.done) return;
  DOWNLOAD_PAGE_STATE.loading = true;
  if (!append) {
    downloadRight.innerHTML = `
      <div class="res-toolbar"><input class="res-search" id="resSearch" placeholder="输入关键词后停止 0.5 秒自动搜索..." value="${escapeHtml(DOWNLOAD_PAGE_STATE.query)}"></div>
      <div class="res-status" id="resStatus">正在从 Modrinth 获取...</div>
      <div id="resList">${'<div class="skeleton-item"></div>'.repeat(5)}</div>
      <button class="load-more" id="loadMoreBtn" style="display:none">加载更多</button>
    `;
  } else {
    const btn = document.getElementById('loadMoreBtn');
    if (btn) btn.style.display = 'none';
  }
  try {
    const { hits, total } = await ApiService.searchModrinth({
      type: DOWNLOAD_PAGE_STATE.type, query: DOWNLOAD_PAGE_STATE.query,
      offset: DOWNLOAD_PAGE_STATE.offset, limit: 20
    });
    DOWNLOAD_PAGE_STATE.total = total;
    DOWNLOAD_PAGE_STATE.offset += hits.length;
    DOWNLOAD_PAGE_STATE.done = hits.length === 0 || DOWNLOAD_PAGE_STATE.offset >= total;
    const listEl = document.getElementById('resList');
    if (!append) listEl.innerHTML = '';
    listEl.insertAdjacentHTML('beforeend', hits.map(r => `
      <div class="res-item" data-project-id="${escapeHtml(r.id)}">
        <div class="res-icon">${r.icon ? `<img src="${escapeHtml(r.icon)}" alt="" loading="lazy">` : escapeHtml(r.name.charAt(0))}</div>
        <div class="res-info">
          <div class="res-name">${escapeHtml(r.name)}<span class="res-badge">${r.source}</span></div>
          <div class="res-desc">${escapeHtml(r.description || '')}</div>
          <div class="res-meta">${formatCount(r.downloads)} 下载 · ${escapeHtml(r.author || '')}</div>
        </div>
        <button class="btn btn-primary" style="height:28px;font-size:11px;">查看</button>
      </div>
    `).join(''));
    listEl.querySelectorAll('.res-item').forEach(item => {
      item.addEventListener('click', (e) => { if (e.target.closest('button')) return; openProjectDetail(item.dataset.projectId); });
      item.querySelector('button')?.addEventListener('click', (e) => { e.stopPropagation(); openProjectDetail(item.dataset.projectId); });
    });
    document.getElementById('resStatus').textContent = `Modrinth · 找到 ${formatCount(total)} 个结果`;
    if (!DOWNLOAD_PAGE_STATE.done) {
      const btn = document.getElementById('loadMoreBtn');
      btn.style.display = 'block';
      btn.textContent = `加载更多（已显示 ${DOWNLOAD_PAGE_STATE.offset} / ${formatCount(total)}）`;
      btn.onclick = () => renderResourceList(true);
    }
    const searchEl = document.getElementById('resSearch');
    if (searchEl && !append) {
      searchEl.addEventListener('input', () => {
        clearTimeout(SEARCH_DEBOUNCE);
        SEARCH_DEBOUNCE = setTimeout(() => {
          const v = searchEl.value.trim();
          if (v === DOWNLOAD_PAGE_STATE.query) return;
          DOWNLOAD_PAGE_STATE.query = v;
          DOWNLOAD_PAGE_STATE.offset = 0;
          DOWNLOAD_PAGE_STATE.done = false;
          DOWNLOAD_PAGE_STATE.loading = false;
          renderResourceList();
        }, 500);
      });
      searchEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); clearTimeout(SEARCH_DEBOUNCE); const v = searchEl.value.trim(); if (v === DOWNLOAD_PAGE_STATE.query) return; DOWNLOAD_PAGE_STATE.query = v; DOWNLOAD_PAGE_STATE.offset = 0; DOWNLOAD_PAGE_STATE.done = false; DOWNLOAD_PAGE_STATE.loading = false; renderResourceList(); }
      });
    }
  } catch (e) {
    if (e.name === 'AbortError') { DOWNLOAD_PAGE_STATE.loading = false; return; }
    const listEl = document.getElementById('resList');
    if (listEl) listEl.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-3);font-size:12px">获取失败：${escapeHtml(e.message)}<br><button class="load-more" onclick="renderResourceList()" style="margin-top:12px">重试</button></div>`;
  } finally {
    DOWNLOAD_PAGE_STATE.loading = false;
  }
}

function simpleMarkdown(md) {
  if (!md) return '';
  let html = escapeHtml(md);
  html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\n\n/g, '</p><p>');
  return '<p>' + html + '</p>';
}

function rgbaToHex(rgba) {
  if (!rgba) return '#000000';
  if (rgba.startsWith('#')) return rgba;
  const m = rgba.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (!m) return '#000000';
  return '#' + [m[1], m[2], m[3]].map(x => parseInt(x).toString(16).padStart(2, '0')).join('');
}
function extractHex(paint, fallback) {
  if (paint && paint.type === 'solid' && paint.color.startsWith('#')) return paint.color;
  if (paint && paint.type === 'solid' && paint.color.startsWith('rgba')) return rgbaToHex(paint.color);
  return fallback;
}

  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  if (viewKey === 'main') document.getElementById('mainView').classList.add('active');
  else if (viewKey === 'instances') document.getElementById('instancesView').classList.add('active');
  else if (viewKey === 'download') document.getElementById('downloadView').classList.add('active');
  else if (viewKey === 'settings') document.getElementById('settingsView').classList.add('active');
  dockItems.forEach(i => i.classList.toggle('active', i.dataset.view === viewKey));
  if (viewKey === 'instances') renderInstancesList();
  closeVersionDock();
}
dockItems.forEach(item => {
  item.addEventListener('click', () => {
    if (item.classList.contains('active')) return;
    setView(item.dataset.view);
  });
});
document.getElementById('instSearch').addEventListener('input', () => renderInstancesList());
document.getElementById('instSort').addEventListener('change', () => renderInstancesList());
document.getElementById('newInstanceBtn').addEventListener('click', () => {
  setView('download');
  document.querySelectorAll('.dl-row').forEach(c => c.classList.remove('active'));
  const row = document.querySelector('.dl-row[data-cat="client"]');
  if (row) row.classList.add('active');
  renderClientVersionList();
});
document.getElementById('importInstanceBtn').addEventListener('click', () => toast('导入整合包功能未实现（demo）', 'info'));
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'n') { e.preventDefault(); document.getElementById('newInstanceBtn').click(); }
  if (e.ctrlKey && e.key === ',') { e.preventDefault(); setView('settings'); }
  if (e.key === 'Escape') {
    const modal = document.getElementById('modalRoot');
    if (modal.classList.contains('show')) {
      const cancelBtn = modal.querySelector('[data-act="cancel"]');
      if (cancelBtn) cancelBtn.click();
    }
    closeVersionDock();
  }
});

/* ============================================================
   初始化
   ============================================================ */
function renderAll() {
  renderVersionCard();
  renderDownloadCard();
  renderCarousel();
  renderInstancesList();
  updateVersionSelector();
}
ThemeService.init();
document.documentElement.dataset.anim = SETTINGS.animations ? 'on' : 'off';
renderAll();
renderSettingsSection('appearance');

setTimeout(() => {
  INSTANCES.forEach(inst => { if (inst.status === 'downloading') simulateDownload(inst.id); });
}, 100);
</script>
</body>
</html>
